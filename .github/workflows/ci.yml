name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  hydro2d:
    name: Build hydro2d
    runs-on: ubuntu-latest
    container:
      image: cphyc/openmpi-iap
    steps:
      - uses: actions/checkout@v4
      - name: Build hydro2d
        run: make NDIM=2 MPI=1 HYDRO=1
        working-directory: bin

  cosmo3d:
    name: Build cosmo3d
    runs-on: ubuntu-latest
    container:
      image: cphyc/openmpi-iap
    steps:
      - uses: actions/checkout@v4
      - name: Build cosmo3d
        run: make NDIM=3 MPI=1 UNITS=COSMO HYDRO=1 GRAV=1 NVAR=7
        working-directory: bin
